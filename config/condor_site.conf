# Condor Observatory Site Parameters
# Atacama, Chile - 5300 m altitude

# Site coordinates (Cerro Toco, Atacama Desert, Chile)
SITE_NAME="Condor Observatory"
SITE_LATITUDE="-23.863"         # degrees (Cerro Toco)
SITE_LONGITUDE="-68.269"        # degrees (Cerro Toco)
SITE_ALTITUDE="5300"            # meters (Cerro Toco elevation)
SITE_ALTITUDE_CM="530000"       # centimeters (for CORSIKA)

# Atmospheric model (US Standard Atmosphere)
ATMOSPHERE_MODEL="5"        # CORSIKA option 5: US Standard

# Magnetic field (IGRF-13 model, 2025, Cerro Toco)
# North component: 25.5 μT
# Vertical component: -31.2 μT (negative = downward in Southern hemisphere)
MAGNETIC_BX="25.5"          # μT, North component
MAGNETIC_BZ="-31.2"         # μT, Vertical component (negative for Southern hemisphere)

# Observation level in CORSIKA units (cm)
OBSLEV="530000"

# Magnetic field in CORSIKA units (microTesla)
MAGNET="$MAGNETIC_BX $MAGNETIC_BZ"

# Useful for scripting
export CONDOR_OBSLEV="530000"
export CONDOR_MAGNET="25.5 -31.2"
